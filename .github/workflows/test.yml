name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  framework-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Test capability manifests
        run: lua test/framework_capabilities.lua
