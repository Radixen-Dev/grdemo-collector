name: Package collector release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          mkdir -p build/guildrate-collector
          cp config.lua fxmanifest.lua README.md build/guildrate-collector/
          cp -R server build/guildrate-collector/server
          (cd build && zip -r ../guildrate-collector.zip guildrate-collector)
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" guildrate-collector.zip --clobber
